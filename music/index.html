<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Music map · Kadents</title>
  <meta name="description" content="A map of songs, where similar songs sit next to each other." />
  <link rel="icon" type="image/svg+xml" href="/kadents-violet.svg" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/svg+xml" href="/kadents-violet-inverted.svg" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#161719">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500&family=Martian+Mono:wght@400;500&display=swap">
  <link rel="preload" href="/maps/music.json" as="fetch" crossorigin>
  <link rel="stylesheet" href="/maps/map.css" />
</head>
<body data-kind="music">
  <canvas id="map" aria-label="Map of songs. Use the search box to find one."></canvas>
  <p id="loading">Loading the map</p>

  <header class="head panel">
    <a class="home" href="/">&larr; KADENTS</a>
    <nav aria-label="Maps">
        <a href="/movies/">Movies</a>
        <a href="/tv/">TV</a>
        <a href="/music/" aria-current="page">Music</a>
    </nav>
    <p class="meta"><b id="count">…</b> songs · <span id="source"></span></p>
    <div class="search">
      <input id="q" type="search" placeholder="Find a title  /" autocomplete="off" aria-label="Find a title">
      <ol id="results" hidden></ol>
    </div>
    <p class="how">Similar songs sit together, by how they sound and the style they're filed under. Scroll or pinch to zoom, drag to move, click a dot.</p>
  </header>

  <button id="groupsBtn" class="panel" type="button">Groups</button>
  <div class="groups panel"><ol id="clusters"></ol></div>
  <div class="zoom panel">
    <button id="zout" type="button" aria-label="Zoom out">&minus;</button>
    <button id="zfit" type="button" aria-label="Show everything">&#9634;</button>
    <button id="zin" type="button" aria-label="Zoom in">+</button>
  </div>

  <div id="tip" hidden></div>
  <section id="card" class="panel" hidden aria-live="polite"></section>

  <script src="/maps/map.js"></script>
</body>
</html>
